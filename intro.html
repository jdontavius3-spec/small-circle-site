<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>SMALL CIRCLE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #060606;
    overflow: hidden;
  }
  .intro {
    position: relative;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .room-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 45% at 50% 40%, rgba(201,151,23,0.22) 0%, rgba(0,0,0,0) 70%);
    animation: bulb-flicker 6.5s ease-in-out infinite;
  }

  .logo-stack {
    position: relative;
    width: min(92vw, 92vh);
  }
  .logo-base {
    position: relative;
    width: 100%;
    height: auto;
    display: block;
    filter: brightness(0) invert(1);
    opacity: 0.85;
    animation: logo-lit 6.5s ease-in-out infinite;
  }
  .halo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 14px rgba(255,214,110,0.9)) drop-shadow(0 0 34px rgba(201,151,23,0.6));
    animation: bulb-flicker 6.5s ease-in-out infinite;
  }

  /* Smoother, wave-like flicker instead of sharp cuts */
  @keyframes bulb-flicker {
    0%   { opacity: 1;    }
    10%  { opacity: 0.55; }
    20%  { opacity: 1;    }
    32%  { opacity: 0.4;  }
    46%  { opacity: 1;    }
    60%  { opacity: 0.6;  }
    72%  { opacity: 1;    }
    86%  { opacity: 0.5;  }
    100% { opacity: 1;    }
  }

  @keyframes logo-lit {
    0%   { opacity: 0.85; }
    10%  { opacity: 0.65; }
    20%  { opacity: 0.85; }
    32%  { opacity: 0.55; }
    46%  { opacity: 0.85; }
    60%  { opacity: 0.68; }
    72%  { opacity: 0.85; }
    86%  { opacity: 0.6;  }
    100% { opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="intro">
  <div class="room-glow"></div>
  <div class="logo-stack">
    <img class="logo-base" src="/assets/logo-no-halo.png" alt="Small Circle">
    <img class="halo" src="/assets/halo.png" alt="">
  </div>
</div>
<script>
  window.setTimeout(() => {
    window.location.href = '/index.html';
  }, 6500);
</script>
</body>
</html>
