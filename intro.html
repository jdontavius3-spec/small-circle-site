<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>SMALL CIRCLE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
  }
  .intro {
    position: relative;
    height: 100dvh;
    overflow: hidden;
  }
  .spotlight,
  .logo-mask {
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-size: 62vmax 62vmax;
    animation: light-move 10s cubic-bezier(.45,.05,.55,.95) forwards;
  }
  .spotlight {
    background-image: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.25) 40%, rgba(255,255,255,0) 68%);
    mix-blend-mode: screen;
  }
  .logo-mask {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: 62vmax 62vmax;
    mask-size: 62vmax 62vmax;
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 68%);
    mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 68%);
  }
  .logo {
    width: min(70vw, 70vh);
    height: auto;
  }
  @keyframes light-move {
    0%   { background-position: -60% -35%; -webkit-mask-position: -60% -35%; mask-position: -60% -35%; }
    18%  { background-position: 130% -20%; -webkit-mask-position: 130% -20%; mask-position: 130% -20%; }
    36%  { background-position: -50% 110%; -webkit-mask-position: -50% 110%; mask-position: -50% 110%; }
    54%  { background-position: 110% 90%; -webkit-mask-position: 110% 90%; mask-position: 110% 90%; }
    70%  { background-position: 10% -15%; -webkit-mask-position: 10% -15%; mask-position: 10% -15%; }
    86%  { background-position: 60% 65%; -webkit-mask-position: 60% 65%; mask-position: 60% 65%; }
    100% { background-position: 50% 50%; -webkit-mask-position: 50% 50%; mask-position: 50% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="intro">
  <div class="spotlight"></div>
  <div class="logo-mask">
    <img class="logo" src="/assets/logo.png" alt="Small Circle">
  </div>
</div>
<script>
  window.setTimeout(() => {
    window.location.href = '/index.html';
  }, 10500);
</script>
</body>
</html>
