<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SMALL CIRCLE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
  }
  .intro {
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    width: min(70vw, 70vh);
    height: auto;
    animation: halo-pulse 7.2s ease-in-out forwards;
  }
  @keyframes halo-pulse {
    0%   { filter: drop-shadow(0 0 0px rgba(201,151,23,0)); }
    20%  { filter: drop-shadow(0 0 30px rgba(201,151,23,0.9)); }
    44%  { filter: drop-shadow(0 0 0px rgba(201,151,23,0)); }
    68%  { filter: drop-shadow(0 0 30px rgba(201,151,23,0.9)); }
    88%  { filter: drop-shadow(0 0 0px rgba(201,151,23,0)); }
    100% { filter: drop-shadow(0 0 0px rgba(201,151,23,0)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="intro">
  <img class="logo" src="/assets/logo.png" alt="Small Circle">
</div>
<script>
  window.setTimeout(() => {
    window.location.href = '/index.html';
  }, 7700);
</script>
</body>
</html>
