<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>SMALL CIRCLE</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
  }
  .intro {
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .logo {
    position: relative;
    width: min(70vw, 70vh);
    height: auto;
    z-index: 1;
    filter: brightness(0.15);
    animation: logo-lit 0.6s ease-in forwards 4.4s;
  }
  .spotlight {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 45vmax;
    height: 45vmax;
    margin: -22.5vmax 0 0 -22.5vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.15) 40%, rgba(255,255,255,0) 70%);
    mix-blend-mode: screen;
    animation: spotlight-search 5s cubic-bezier(.45,.05,.55,.95) forwards;
  }
  @keyframes spotlight-search {
    0%   { transform: translate(-60vw, -35vh) scale(0.6); opacity: 0.9; }
    18%  { transform: translate(50vw, -20vh) scale(0.7); }
    34%  { transform: translate(-40vw, 30vh) scale(0.65); }
    50%  { transform: translate(30vw, 20vh) scale(0.8); }
    64%  { transform: translate(-15vw, -25vh) scale(0.7); }
    80%  { transform: translate(8vw, 6vh) scale(0.9); }
    100% { transform: translate(0, 0) scale(1.1); opacity: 1; }
  }
  @keyframes logo-lit {
    to { filter: brightness(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="intro">
  <div class="spotlight"></div>
  <img class="logo" src="/assets/logo.png" alt="Small Circle">
</div>
<script>
  window.setTimeout(() => {
    window.location.href = '/index.html';
  }, 5900);
</script>
</body>
</html>
