<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="SMALL CIRCLE — only for a few..">
  <title>SMALL CIRCLE</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="shell">
    <img class="logo" src="/assets/logo.png" alt="Small Circle — only for a few..">
    <nav id="nav" class="index" aria-label="Small Circle"></nav>
    <form id="passkey-form" class="passkey" autocomplete="off">
      <input id="passkey" type="password" name="passkey" placeholder="PASSKEY" aria-label="Passkey" autocapitalize="characters" spellcheck="false" required>
      <button type="submit">ENTER</button>
    </form>
    <div id="message" class="message" aria-live="polite"></div>
    <button id="lock-button" class="lock-button" type="button" hidden>LOCK</button>
    <footer class="footer">© 2026</footer>
  </main>
  <div id="transition" class="transition" hidden>
  <div class="t-stack">
    <span class="t-word" data-w="1">THIS</span>
    <span class="t-word" data-w="2">WON’T</span>
    <span class="t-word" data-w="3">GO</span>
    <span class="t-word" data-w="4">VIRAL.</span>
  </div>
  <script src="/assets/site.js"></script>
</body>
</html>
